<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三维协同沙盘 · 重卡接入与电网协同评估</title><link rel="stylesheet" href="./site.css"><link rel="stylesheet" href="./scene.css"></head>
<body data-page="quality"><div id="site-header"></div><main class="scene-shell">
<section class="scene-heading"><div><span class="eyebrow">SHANGHAI / ENERGY & MOBILITY</span><h1>一座充电站，与它的电网。</h1></div><div class="scene-actions"><button id="guide-start" class="primary">开始讲解 →</button><button data-copy-link>分享当前画面</button><a class="button" href="./candidates.html" id="back-candidates">查看分级依据 ↗</a></div></section>
<section class="scene-toolbar"><label>背景<select id="scene-case"><option value="summer-normal">夏季 · 正常代表周</option><option value="winter-background">冬季 · 背景偏高代表周</option></select></label><label>方案<select id="scene-plan"><option value="unmanaged">常规充电</option><option value="ordered">有序充电</option><option value="capacitor">有序＋无功补偿</option><option value="filter">有序＋谐波滤波</option><option value="baseline">无新增重卡</option></select></label><nav aria-label="三维场景"><button data-level="region" class="active">区域总览</button><button data-level="station">精细场站</button><button data-level="grid">供电影响</button></nav><label class="reduce-label"><input type="checkbox" id="reduce-motion">减少动态</label></section>
<div class="scene-workspace"><section class="scene-stage" aria-label="三维场景区域"><div id="scene-canvas" tabindex="0" aria-label="三维沙盘：拖动旋转，右键平移，滚轮缩放；方向键平移，Home恢复视角"></div><div id="scene-labels"></div><div class="scene-caption"><span id="scene-kicker">01 / 区域总览</span><h2 id="scene-title">运输需求，连接四个站点。</h2><p id="scene-caption-text">公开道路与功能分区 · 场站与工程参数为合成示范</p></div><div id="guide-card" hidden><span id="guide-count"></span><b id="guide-title"></b><p id="guide-copy"></p><div><button id="guide-prev">上一步</button><button id="guide-next">下一步 →</button><button id="guide-resume" hidden>继续讲解</button><button id="guide-close">退出</button></div></div><div class="camera-controls"><button id="camera-home">⌂ 全景</button><button id="camera-top">俯视</button><button id="camera-iso">斜视</button><button id="follow-vehicle">跟随车辆</button><button id="zoom-in" aria-label="放大三维场景">＋</button><button id="zoom-out" aria-label="缩小三维场景">−</button></div><div id="scene-loading" role="status">正在准备三维场景…</div><div id="scene-fallback" hidden><img src="./overview-map.svg" alt="四站二维区域地图"><div><h2>二维浏览模式</h2><p id="fallback-reason"></p><button id="enable-3d">开启三维场景</button><a class="button" href="./candidates.html">打开可缩放地图 ↗</a></div></div><div class="scene-attribution">© OpenStreetMap contributors / ODbL · 场站内部布局与建筑高度为示意</div></section>
<aside class="scene-sidebar"><div class="sidebar-title"><span>当前对象</span><select id="scene-station" aria-label="选择场站"><option value="S1">S1 · 港口工业</option><option value="S2">S2 · 物流园区</option><option value="S3">S3 · 商住混合</option><option value="S4">S4 · 居民区邻近</option></select></div><div id="scene-object"></div><div id="scene-decision"></div><div id="scene-readings"></div><div class="event-actions"><button id="event-voltage">定位最低电压</button><button id="event-harmonic">定位最高谐波</button><button id="event-overload">定位设备峰值</button></div><div id="scene-chart"></div><div id="scene-vehicles"></div><div id="scene-comparison"></div><details><summary>来源与版本</summary><div id="scene-evidence"></div></details><a id="quality-link" class="button" href="./quality.html">打开完整电能质量分析 ↗</a></aside></div>
<section class="scene-timeline"><div class="playback-buttons"><button id="scene-play" class="primary">▶ 播放</button><button id="scene-replay">↺ 从头重放</button><select id="scene-speed" aria-label="播放速度"><option value="1">1×</option><option value="4">4×</option><option value="12">12×</option></select></div><input id="scene-time" type="range" min="0" max="671" value="0" step="1" aria-label="回放时刻"><div class="time-readout"><output id="scene-clock">—</output><small>读数：15分钟计算点 · 动画：示意插值</small></div></section>
<div class="scene-footer"><span id="scene-status" role="status">可自由探索；首次进入不自动播放。</span><button id="use-2d">切换二维</button><span id="scene-performance"></span></div>
</main><script type="module" src="./scene.js"></script></body></html>
